# Publishes the results dashboard (dashboard/index.html + results/) to GitHub Pages whenever results change.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: dashboard
on:
  push:
    branches: [main]
    paths: ["dashboard/**", "results/**", ".github/workflows/dashboard.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/results
          cp dashboard/index.html _site/
          cp results/index.json _site/results/ 2>/dev/null || echo '{"updated": "never", "files": []}' > _site/results/index.json
          for d in results/*/; do [ -d "$d" ] && cp -r "$d" _site/results/; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
