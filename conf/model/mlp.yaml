name: mlp
estimator:
  _target_: agribench_heads.LightningMLPClassifier
  _convert_: all
  hidden: [256]
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 50
  patience: 5
  batch_size: 256
  seed: ${experiment.seed}
  accelerator: ${oc.env:AGRIBENCH_ACCELERATOR,auto}
search:
  param_grid:
    lr: [0.001, 0.0003]
    dropout: [0.1, 0.3]
