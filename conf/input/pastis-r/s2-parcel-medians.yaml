format: s2-parcel-medians-v1
input_profile: s2
inputs: Sentinel-2 parcel observations from PASTIS-R PixelSet v1
required_arrays: [ids, s2, observed, months, provenance]
sample_arrays: [ids, s2, observed]
expected_provenance:
  bands: [B2, B3, B4, B5, B6, B7, B8, B8A, B11, B12]
  reference_date: "2018-09-01"
  grid_start_days: -200
  bin_width_days: 30
  bins_inclusive: [7, 20]
preprocessing: Per-band median across parcel pixels, then median across acquisitions within each bin
missing_observations: Mask absent bins using observed
